# ─────────────────────────────────────────────────────────────────────────────
# The Complaints Department — webhook agent.
#
# One fired webhook = one session in its own microVM = one ticket. The session
# classifies a single grievance and writes the row to Managed Postgres itself,
# through Action Gateway's action_code sandbox. The web tier never sees it.
#
# deploy.sh expands every $${VAR} placeholder from the environment at create
# time and supplies secrets with --secret, so nothing sensitive lives here.
# Validate with:  doctl harness-runtime validate agents/complaint-agent.yaml
# ─────────────────────────────────────────────────────────────────────────────

name: complaints-intake

# opencode, not claude-code, and the reason is not stylistic: MARS
# preflight-validates ANTHROPIC_API_KEY against api.anthropic.com whenever the
# adapter is claude-code. It ignores every base-URL override while doing so, so
# a DigitalOcean model key fails with a 401 and the session never starts.
# opencode takes the credential at face value and calls whatever base URL it is
# given, which is what keeps every model call in this demo on DigitalOcean.
agent: opencode
description: Converts one public grievance into one sober enterprise ticket.

# Smallest box that will do. The work is one model call and one INSERT; the
# demo's scale story is the number of these, not the size of any one.
size: mars-1vcpu-1gb

persistent_workspace: false
idle_timeout: 5m

env:
  # All inference goes through DigitalOcean's serverless inference service.
  #
  # Note the /v1: opencode appends "/messages" to this base, where the
  # Anthropic SDK would append "/v1/messages". Without it every call 404s
  # against a DigitalOcean maintenance page that looks like an outage.
  ANTHROPIC_BASE_URL: ${INFERENCE_BASE_URL}/v1
  ANTHROPIC_MODEL: ${INFERENCE_MODEL}

  # The platform-native equivalents. opencode does not read these today — it
  # falls back to api.anthropic.com if they are all it is given — but they are
  # the documented MARS keys, so set both and let the adapter take its pick.
  HARNESS_INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}/v1
  HARNESS_INFERENCE_MODEL: ${INFERENCE_MODEL}

  # Where the ticket goes. Read by the prompt, not by the harness.
  TICKET_TABLE: ${MARS_TICKET_TABLE}

secrets:
  # A DigitalOcean model access key, not an Anthropic key — the base URL above
  # points at DigitalOcean, and this is the credential that service expects.
  ANTHROPIC_API_KEY: ${INFERENCE_API_KEY}

  # Connection string for the least-privilege `mars_writer` role: INSERT on
  # tickets, SELECT on tickets.id only, UPDATE on three columns of complaints.
  # See db/grants.postgres.sql. The boundary is enforced by Postgres, not by
  # trusting the prompt.
  MARS_DATABASE_URL: ${MARS_DATABASE_URL}


permissions:
  # A `permissions` block is mandatory for fresh triggers — a headless run
  # cannot fall back to the default "ask" policy with nobody there to answer.
  #
  # `default: allow`, because opencode declares no capability for named tool
  # rules and a blanket deny would stop the agent doing the one job it exists
  # for. There is deliberately no `network:` block here: it filters by
  # hostname and would re-block the database port that `egress.allow_ips`
  # opens below. Egress is the network control; the Postgres grants in
  # db/grants.postgres.sql are the one that actually matters.
  default: allow
  filesystem:
    # The agent installs a Postgres client and writes a short script, both of
    # which need somewhere to land. Confined to the workspace.
    mode: workspace-write

egress: unrestricted
# Deliberately unrestricted, and it is worth knowing why before you tighten it.
#
# The tidy version of this block is:
#
#   egress:
#     allow_hosts: [${INFERENCE_HOST}, pypi.org, files.pythonhosted.org]
#     allow_ips:   [${DB_PUBLIC_IP}]
#
# That works in a session created directly with `harness-runtime create` —
# verified, Postgres on 25060 reachable. In a session started by a *trigger*
# the same stored template still times out on that port, so a headless run can
# classify a complaint and then fail to write it, reporting a perfectly
# reasonable-sounding "check your trusted sources" that sends you looking in
# the wrong place entirely. Until that gap closes, the demo runs open.
#
# What still constrains this sandbox: it holds one credential, for a role that
# can INSERT one table and read back one column (db/grants.postgres.sql).
# That is the boundary doing the real work here, and it is unaffected.

# No `vpc_uuid`. MARS rejects VPC attachment in every region available to this
# team ("This VPC's region is not supported"), so the sandbox reaches Managed
# Postgres over its public endpoint instead — TLS, a scoped role, and the
# egress allowlist above. Re-add it here the moment your team can attach.
