# ─────────────────────────────────────────────────────────────────────────────
# The Complaints Department — scheduled summary agent.
#
# The closing beat of the talk. A cron trigger fires this once at a set time;
# it reads the ticket volumes, writes an executive summary with a recommended
# headcount ask for Facilities, and stores it for the dashboard to render.
#
# Same shape as the webhook agent, one difference that matters: this one needs
# to READ, so it connects as a different, read-plus-summaries role.
# Validate with:  doctl harness-runtime validate agents/summary-agent.yaml
# ─────────────────────────────────────────────────────────────────────────────

name: complaints-summary
agent: opencode
description: Produces the period executive summary from ticket volumes.

size: mars-2vcpu-2gb
persistent_workspace: false
idle_timeout: 5m

env:
  ANTHROPIC_BASE_URL: ${INFERENCE_BASE_URL}/v1
  ANTHROPIC_MODEL: ${INFERENCE_MODEL}
  HARNESS_INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}/v1
  HARNESS_INFERENCE_MODEL: ${INFERENCE_MODEL}

secrets:
  ANTHROPIC_API_KEY: ${INFERENCE_API_KEY}
  # The `mars_reporter` role: SELECT on tickets, INSERT on summaries.
  # It cannot read complaint bodies and cannot touch the tickets it reports on.
  MARS_DATABASE_URL: ${MARS_REPORTER_DATABASE_URL}

tools:
  - do.actions: [action_code]

permissions:
  # A `permissions` block is mandatory for fresh triggers — a headless run
  # cannot fall back to the default "ask" policy with nobody there to answer.
  #
  # `default: allow` rather than deny, because opencode declares no capability
  # for the action_code tool, so any rule naming it is rejected at create time
  # and a blanket deny would block the one tool the agent exists to use. The
  # real constraints are the single-tool catalog above, the two rules below,
  # the egress allowlist, and — the one that actually matters — the Postgres
  # grants in db/grants.postgres.sql.
  default: allow
  filesystem:
    mode: read-only
  network:
    default: deny
    allow:
      - ${INFERENCE_HOST}
      - ${DB_PUBLIC_HOST}

egress:
  allow_hosts:
    - ${INFERENCE_HOST}
    - ${DB_PUBLIC_HOST}
