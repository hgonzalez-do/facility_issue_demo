# ─────────────────────────────────────────────────────────────────────────────
# The Complaints Department — scheduled summary agent.
#
# The closing beat of the talk. A cron trigger fires this once at a set time;
# it reads the ticket volumes, writes an executive summary with a recommended
# headcount ask for Facilities, and stores it for the dashboard to render.
#
# Same shape as the webhook agent, one difference that matters: this one needs
# to READ, so it connects as a different, read-plus-summaries role.
# Validate with:  doctl harness-runtime validate agents/summary-agent.yaml
# ─────────────────────────────────────────────────────────────────────────────

name: complaints-summary
agent: opencode
description: Produces the period executive summary from ticket volumes.

size: mars-2vcpu-2gb
persistent_workspace: false
idle_timeout: 5m

env:
  ANTHROPIC_BASE_URL: ${INFERENCE_BASE_URL}/v1
  ANTHROPIC_MODEL: ${INFERENCE_MODEL}
  HARNESS_INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}/v1
  HARNESS_INFERENCE_MODEL: ${INFERENCE_MODEL}

secrets:
  ANTHROPIC_API_KEY: ${INFERENCE_API_KEY}
  # The `mars_reporter` role: SELECT on tickets, INSERT on summaries.
  # It cannot read complaint bodies and cannot touch the tickets it reports on.
  MARS_DATABASE_URL: ${MARS_REPORTER_DATABASE_URL}


permissions:
  # A `permissions` block is mandatory for fresh triggers — a headless run
  # cannot fall back to the default "ask" policy with nobody there to answer.
  #
  # `default: allow`, because opencode declares no capability for named tool
  # rules and a blanket deny would stop the agent doing the one job it exists
  # for. There is deliberately no `network:` block here: it filters by
  # hostname and would re-block the database port that `egress.allow_ips`
  # opens below. Egress is the network control; the Postgres grants in
  # db/grants.postgres.sql are the one that actually matters.
  default: allow
  filesystem:
    # The agent installs a Postgres client and writes a short script, both of
    # which need somewhere to land. Confined to the workspace.
    mode: workspace-write

egress: unrestricted
# Deliberately unrestricted, and it is worth knowing why before you tighten it.
#
# The tidy version of this block is:
#
#   egress:
#     allow_hosts: [${INFERENCE_HOST}, pypi.org, files.pythonhosted.org]
#     allow_ips:   [${DB_PUBLIC_IP}]
#
# That works in a session created directly with `harness-runtime create` —
# verified, Postgres on 25060 reachable. In a session started by a *trigger*
# the same stored template still times out on that port, so a headless run can
# classify a complaint and then fail to write it, reporting a perfectly
# reasonable-sounding "check your trusted sources" that sends you looking in
# the wrong place entirely. Until that gap closes, the demo runs open.
#
# What still constrains this sandbox: it holds one credential, for a role that
# can INSERT one table and read back one column (db/grants.postgres.sql).
# That is the boundary doing the real work here, and it is unaffected.
